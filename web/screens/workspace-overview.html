<!-- Owner: ui-3. Overview section of an opened investigation (Views/Workspace/Overview.fs, Conclusions.fs).
     INV-007, INV-008, INV-018, INV-014, INV-024, INV-025, INV-033; INV-032 only if the engine offers it. -->
<template data-if="screen.investigation.overview">
  <section class="ef-section causa-analysis" aria-labelledby="causa-overview-heading" data-requirement-id="INV-042">
    <h2 class="ef-section-heading" id="causa-overview-heading">Overview</h2>
    <template data-if="investigation.overview.loaded">
      <div class="ef-stack causa-analysis__body">
        <dl class="ef-key-value-list causa-overview__facts">
          <div><dt>Original problem statement</dt><dd data-requirement-id="INV-008" data-text="investigation.overview.problem"></dd></div>
          <div><dt>Creation timestamp</dt><dd data-requirement-id="INV-007"><time data-bind-datetime="investigation.overview.created" data-text="investigation.overview.created"></time></dd></div>
          <div><dt>Investigation state</dt><dd data-requirement-id="INV-018"><span class="ef-status-lozenge" data-text="investigation.overview.state"></span></dd></div>
          <div><dt>Version</dt><dd data-text="investigation.overview.version"></dd></div>
          <div><dt>Hypotheses</dt><dd data-text="investigation.overview.hypothesisCount"></dd></div>
          <div><dt>Evidence items</dt><dd data-text="investigation.overview.evidenceCount"></dd></div>
        </dl>

        <section class="ef-stack" aria-labelledby="causa-observations-heading">
          <h3 id="causa-observations-heading">Observations</h3>
          <template data-if="investigation.overview.observations.empty">
            <p class="causa-analysis__empty">No observations recorded yet.</p>
          </template>
          <ul class="ef-stack causa-analysis__list" aria-labelledby="causa-observations-heading">
            <template data-each="investigation.overview.observations" data-key="id">
              <li>
                <article class="ef-card causa-record" aria-label="Observation">
                  <p class="causa-record__text" data-text="text"></p>
                  <template data-if="hasSource"><p class="causa-record__meta">Source: <span data-text="source"></span></p></template>
                  <template data-if="hasObservedAt"><p class="causa-record__meta">Observed at <span data-text="observedAt"></span></p></template>
                </article>
              </li>
            </template>
          </ul>
          <template data-if="investigation.observation.record.offered">
            <div class="ef-form ef-stack causa-editor" role="group" aria-label="Record an observation">
              <div class="ef-field">
                <label class="ef-field__label" for="causa-observation-text">Observation text</label>
                <textarea id="causa-observation-text" rows="3" maxlength="10000" required data-requirement-id="INV-024"
                  data-event="investigation.observation.text" data-on="input" data-bind-value="investigation.observation.text"></textarea>
              </div>
              <div class="ef-field">
                <label class="ef-field__label" for="causa-observation-source">Observation source reference</label>
                <input id="causa-observation-source" type="text" maxlength="10000" data-requirement-id="INV-025"
                  data-event="investigation.observation.source" data-on="input" data-bind-value="investigation.observation.source">
              </div>
              <p class="causa-editor__reason" data-text="investigation.observation.record.reason"></p>
              <button type="button" class="ef-button" data-requirement-id="INV-014" data-event="investigation.observation.record" data-bind-disabled="investigation.observation.record.disabled">Record an observation</button>
            </div>
          </template>
        </section>

        <section class="ef-stack" aria-labelledby="causa-conclusions-heading">
          <h3 id="causa-conclusions-heading">Conclusions</h3>
          <template data-if="investigation.conclusions.empty">
            <p class="causa-analysis__empty">No conclusions recorded.</p>
          </template>
          <ul class="ef-stack causa-analysis__list" aria-labelledby="causa-conclusions-heading">
            <template data-each="investigation.conclusions.items" data-key="id">
              <li>
                <article class="ef-card causa-record" aria-label="Conclusion">
                  <p class="causa-record__text" data-requirement-id="INV-033" data-text="statement"></p>
                  <template data-if="hasResidual"><p class="causa-record__meta">Residual uncertainty: <span data-text="residual"></span></p></template>
                </article>
              </li>
            </template>
          </ul>
          <template data-if="investigation.conclusion.record.offered">
            <div class="ef-form ef-stack causa-editor" role="group" aria-label="Record a conclusion">
              <div class="ef-field">
                <label class="ef-field__label" for="causa-conclusion-statement">Conclusion statement</label>
                <textarea id="causa-conclusion-statement" rows="3" maxlength="10000" required data-requirement-id="INV-033"
                  data-event="investigation.conclusion.statement" data-on="input" data-bind-value="investigation.conclusion.statement"></textarea>
              </div>
              <p class="causa-editor__reason" data-text="investigation.conclusion.record.reason"></p>
              <button type="button" class="ef-button" data-requirement-id="INV-032" data-event="investigation.conclusion.record" data-bind-disabled="investigation.conclusion.record.disabled">Record a conclusion</button>
            </div>
          </template>
        </section>
      </div>
    </template>
    <template data-if="investigation.overview.missing">
      <p class="causa-analysis__empty" data-text="investigation.overview.notLoaded"></p>
    </template>
  </section>
</template>
