<!-- Owner: ui. investigation-list (UI-001, UI-020): the Investigations destination, the investigations the engine
     listed and the New investigation action. The data repository region follows (connection fragment). -->
<template data-if="screen.investigations">
  <section class="causa-screen causa-investigations" aria-labelledby="investigations-heading" data-requirement-id="UI-001">
    <h1 id="investigations-heading" data-text="investigations.heading">Investigations</h1>
    <template data-if="investigations.status">
      <p class="causa-note" role="status" data-text="investigations.status"></p>
    </template>
    <template data-if="investigations.can-start">
      <p class="ef-actions"><a class="ef-button" href="#/new">New investigation</a></p>
    </template>
    <template data-if="investigations.any">
      <ul class="causa-investigation-list" aria-label="Investigations">
        <template data-each="investigations.items" data-key="key">
          <li class="causa-investigation-list__item">
            <a class="causa-investigation-list__title" data-bind-href="href" data-text="title"></a>
            <span class="ef-status-lozenge" data-bind-data-state="kindState" data-text="kind"></span>
            <span class="causa-note" data-text="note"></span>
          </li>
        </template>
      </ul>
    </template>
  </section>
</template>
