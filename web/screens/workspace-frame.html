<!-- Owner: ui-2. The investigation workspace frame: header (identity, INV-006/007/008/018/023; save state INV-015/016)
     and the "Investigation sections" navigation (UI-029). -->
<template data-if="screen.investigation">
  <div class="causa-frame">
    <template data-if="investigation.absent">
      <p class="ef-alert causa-frame__absent" role="status" data-text="investigation.absence"></p>
    </template>
    <template data-if="investigation.found">
      <header class="ef-record-header causa-frame__header">
        <div class="ef-record-header__main">
          <div class="ef-record-header__title">
            <div><span class="ef-record-header__type">Investigation</span><h1 data-text="investigation.title"></h1></div>
          </div>
          <dl class="ef-key-value-list causa-frame__identity">
            <div data-requirement-id="INV-006"><dt>Identifier</dt><dd><span class="ef-identifier" data-text="investigation.identifier"></span></dd></div>
            <div data-requirement-id="INV-008"><dt>Original problem statement</dt><dd class="causa-frame__text" data-text="investigation.problem"></dd></div>
            <template data-if="investigation.hasQuestion">
              <div data-requirement-id="INV-023"><dt>Primary investigative question</dt><dd class="causa-frame__text" data-text="investigation.question"></dd></div>
            </template>
            <div data-requirement-id="INV-018"><dt>Investigation state</dt><dd data-text="investigation.state"></dd></div>
          </dl>
        </div>
        <div class="ef-record-header__actions causa-frame__save">
          <template data-if="investigation.save.shown">
            <div class="causa-save">
              <span class="ef-status-lozenge causa-save__state" role="status" aria-label="Save state" data-requirement-id="INV-016"
                data-bind-data-state="investigation.save.lozenge" data-text="investigation.save.state"></span>
              <template data-if="investigation.save.canSave">
                <button type="button" data-requirement-id="INV-015" data-event="investigation.save">Save</button>
              </template>
            </div>
          </template>
        </div>
      </header>
    </template>
    <nav class="ef-navigation-shell causa-sections" aria-label="Investigation sections" data-requirement-id="UI-029">
      <ul class="causa-sections__list">
        <li><a data-bind-href="investigation.section.overview.href" data-bind-aria-current="investigation.section.overview.current">Overview</a></li>
        <li><a data-bind-href="investigation.section.causal-analysis.href" data-bind-aria-current="investigation.section.causal-analysis.current">Causal Analysis</a></li>
        <li><a data-bind-href="investigation.section.evidence.href" data-bind-aria-current="investigation.section.evidence.current">Evidence</a></li>
        <li><a data-bind-href="investigation.section.hypotheses.href" data-bind-aria-current="investigation.section.hypotheses.current">Hypotheses</a></li>
        <li><a data-bind-href="investigation.section.timeline.href" data-bind-aria-current="investigation.section.timeline.current">Timeline</a></li>
      </ul>
    </nav>
  </div>
</template>
